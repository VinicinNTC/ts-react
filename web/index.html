<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form 2026</title>
    <link rel="stylesheet" href="style.css" />
    
  </head>
  <body>

    <div class="container">

    <form>
        <label> Login: </label>
        <input type="text" id="login" class="caixa" placeholder="Crie seu login" />

        <br>
        <label> Senha: </label>
        <input type="password" id="senha" class="caixa" placeholder="Crie sua senha" />

        <br>

        <label> Nome: </label>  
        <input type="text" id="nome" class="caixa" placeholder="Insira seu nome" />

        <br>
        <label> Email: </label>
        <input type="email" id="email" class="caixa" placeholder="Insira seu email" />
        
    </form>

    <button type="button" id="btn-1" class="btn-1"> Cadastrar </button>

    </div>

  <script type="module" src="/src/main.tsx"></script>

  </body>
